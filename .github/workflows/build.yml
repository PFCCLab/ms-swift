name: Build Whl

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

env:
  BRANCH: ${{ github.ref_name }}
  COMMIT_ID: ${{ github.sha }}
  TASK: MS-SWIFT-${{ github.sha }}-build
  CE_name: build-ms-swift
  no_proxy: "localhost,bj.bcebos.com,su.bcebos.com,bcebos.com,apiin.im.baidu.com,gitee.com,aliyun.com,.baidu.com,.tuna.tsinghua.edu.cn"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on:
      group: h20-2c
    steps:
      - name: Determine the runner
        run: |
          runner_name=`(echo $PWD|awk -F '/' '{print $3}')`
          echo $runner_name
          wget -q https://xly-devops.bj.bcebos.com/utils.sh
          source utils.sh
          determine_gpu_runner ${runner_name}
      - name: Checkout Code
        run: |
          git clone https://github.com/PFCCLab/ms-swift.git
          cd ms-swift
          git log --pretty=oneline -5
      - name: Determine Image Name
        run: |
          echo "IMAGE_NAME=ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:cuda130-dev" >> "$GITHUB_ENV"
      - name: Run Container
        env:
          work_dir: ${{ github.workspace }}
          FLAGS_dynamic_static_unified_comm: "True"
          python_version: "3.12"
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> "$GITHUB_ENV"
          docker run -d -t --name ${container_name} --net=host -v /dev/shm:/dev/shm --shm-size=32G \
            -v $work_dir/../../..:$work_dir/../../.. \
            -v $work_dir:/workspace \
            -v /home/.cache/pip:/home/.cache/pip \
            -v /home/paddle-1/models/:/home/models/ \
            -e "BRANCH=$BRANCH" \
            -e "COMMIT_ID=$COMMIT_ID" \
            -e work_dir \
            -e no_proxy \
            -e CE_name \
            -e FLAGS_dynamic_static_unified_comm \
            -e python_version \
            -w /workspace --privileged $IMAGE_NAME

      - name: Build Whl
        run: |
          docker exec -t $container_name /bin/bash -c '
          ldconfig
          pip config set global.cache-dir "/home/.cache/pip"
          set -e
          cd /workspace/ms-swift && git config --global --add safe.directory $PWD
          bash scripts/dependence/build.sh
          '

      - name: Upload Products
        if: always()
        run: |
          docker exec -t $container_name /bin/bash -c '
          cd /workspace/upload
          cp /home/models/bos/bos_tools.py ./
          cp /home/models/bos/notify_paddle_link.py ./
          for FILE in /workspace/upload/*.whl; do
            file=$(basename "$FILE")
            if [[ "$file" =~ \.dev[0-9]{8}-.*\.whl$ ]]; then
              echo "Skip dated dev wheel: $file"
              rm -f "$FILE"
              continue
            fi
            if [[ "$file" =~ \.post[0-9]+-.*\.whl$ && ! "$file" =~ -0\.0\.0\.post ]]; then
              echo "Skip release post wheel: $file"
              rm -f "$FILE"
              continue
            fi
            python bos_tools.py $file paddle-qa/paddlefleet/whl
            echo "$file: https://paddle-qa.bj.bcebos.com/paddlefleet/whl/$file"
            # if [[ ! "$file" =~ -0\.0\.0\. ]]; then
            #   python3 notify_paddle_link.py ms-swift $file
            # else
            #   echo "Skip notify for 0.0.0 wheel: $file"
            # fi
          done
          TAR_FILE=/workspace/upload/ms-swift.tar.gz
          if [ -e "$TAR_FILE" ]; then
            file=$(basename "$TAR_FILE")
            python bos_tools.py $file paddle-qa/paddlefleet/whl
            echo "$file: https://paddle-qa.bj.bcebos.com/paddlefleet/whl/$file"
          else
            echo "ms-swift.tar.gz not found, skip upload"
          fi
          '

      - name: Terminate And Delete the Container
        if: always()
        run: |
          docker rm -f $container_name 2>/dev/null || true
